            format: date
        - name: regulationDateTo
          in: query
          schema:
            type: string
            format: date
        - name: billDateFrom
          in: query
          schema:
            type: string
            format: date
        - name: billDateTo
          in: query
          schema:
            type: string
            format: date
        - name: regionValueDateFrom
          in: query
          schema:
            type: string
            format: date
        - name: regionValueDateTo
          in: query
          schema:
            type: string
            format: date
        - name: regulationUniqueIdentifier
          in: query
          schema:
            type: string
        - name: accountRegistryCode
          in: query
          schema:
            type: string
        - name: billAmountCents
          in: query
