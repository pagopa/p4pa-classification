components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ClassificationErrorDTO:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - CLASSIFICATION_NOT_FOUND
            - CLASSIFICATION_BAD_REQUEST
            - CLASSIFICATION_CONFLICT
            - CLASSIFICATION_GENERIC_ERROR
        message:
          type: string
    PagedFullClassificationView:
      type: object
      required:
        - content
        - size
        - totalElements
        - totalPages
        - number
      properties:
        content:
          type: array
          items:
            type: 'FullClassificationView'
        size:
          type: integer
          format: int64
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
    PagedClassificationView:
      type: object
      required:
        - content
        - size
        - totalElements
        - totalPages
        - number
      properties:
        content:
          type: array
          items:
            type: 'ClassificationView'
        size:
          type: integer
          format: int64
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
    PagedTreasuredClassification:
      type: object
      required:
        - content
        - size
        - totalElements
        - totalPages
        - number
      properties:
        content:
          type: array
          items:
            type: 'TreasuredClassificationDTO'
        size:
          type: integer
          format: int64
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
    Assessments:
      type: object
      required:
        - organizationId
        - debtPositionTypeOrgCode
        - status
        - assessmentName
        - printed
      properties:
        assessmentId:
          type: integer
          format: int64
        organizationId:
          type: integer
          format: int64
        debtPositionTypeOrgCode:
          type: string
        status:
          type: string
          enum:
            - NEW
            - IN_PROGRESS
            - COMPLETED
        assessmentName:
          type: string
        printed:
          type: boolean
    PagedAssessmentsView:
      type: object
      required:
        - content
        - size
        - totalElements
        - totalPages
        - number
      properties:
        content:
          type: array
          items:
            type: 'Assessments'
        size:
          type: integer
          format: int64
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
        number:
          type: integer
      format: int64
    CreateAssessmentsRegistryByDebtPositionDTOAndIudRequest:
      type: object
      required:
        - debtPositionDTO
      properties:
        debtPositionDTO:
          type: "DebtPositionDTO"
        iudList:
          type: array
          items:
            type: string
