openapi: 3.0.1
info:
  title: p4pa-classification
  description: Api and Models
  version: 0.0.1
servers:
  - url: http://localhost:8080
    description: Generated server url
security:
  - BearerAuth: []
paths:
  /crud-ext/treasury:
    post:
      tags:
        - treasury-entity-extended-controller
      operationId: saveAll
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: 'Treasury'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: integer
                format: int32
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationErrorDTO'
  /crud-ext/treasury/by-organizationId-billCode-billYear:
    delete:
      tags:
        - treasury-entity-extended-controller
      operationId: deleteByOrganizationIdAndBillCodeAndBillYear
      parameters:
        - name: organizationId
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: billCode
          in: query
          required: true
          schema:
            type: string
        - name: billYear
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: integer
                format: int64
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationErrorDTO'
  /crud-ext/payments-reporting:
    post:
      tags:
        - payments-reporting-entity-extended-controller
      operationId: saveAll_1
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: 'PaymentsReporting'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: integer
                format: int32
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationErrorDTO'
  /crud-ext/classifications:
    post:
      tags:
        - classification-entity-extended-controller
      operationId: saveAll_2
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: 'Classification'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: integer
                format: int32
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationErrorDTO'
  /crud-ext/classifications/by-organizationId-iuv-iur-transferIndex:
    delete:
      tags:
        - classification-entity-extended-controller
      operationId: deleteByOrganizationIdAndIuvAndIurAndTransferIndex
      parameters:
        - name: organizationId
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: iuv
          in: query
          required: true
          schema:
            type: string
        - name: iur
          in: query
          required: true
          schema:
            type: string
        - name: transferIndex
          in: query
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: integer
                format: int64
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationErrorDTO'
  /crud-ext/classifications/by-organizationId-iuf-label:
    delete:
      tags:
        - classification-entity-extended-controller
      operationId: deleteByOrganizationIdAndIufAndLabel
      parameters:
        - name: organizationId
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: iuf
          in: query
          required: true
          schema:
            type: string
        - name: label
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: integer
                format: int64
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationErrorDTO'
  /classifications/{organizationId}/export:
    get:
      tags:
        - classification
      operationId: export
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: The ID of the organization
        - name: operatorExternalUserId
          in: query
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassificationDTO"
        required: true
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedClassificationView'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationErrorDTO'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationErrorDTO'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationErrorDTO'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ClassificationDTO:
        type: object
        required:
            - label
        properties:
          iuf:
            type: string
          iud:
            type: string
          iuv:
            type: string
          iur:
            type: string
          label:
            type: string
          lastClassificationDateFrom:
            type: string
            format: date-time
          lastClassificationDateTo:
            type: string
            format: date-time
          payDateFrom:
            type: string
            format: date-time
          payDateTo:
            type: string
            format: date-time
          paymentDateTimeFrom:
            type: string
            format: date-time
          paymentDateTimeTo:
            type: string
            format: date-time
          regulationDateFrom:
            type: string
            format: date-time
          regulationDateTo:
            type: string
            format: date-time
          billDateFrom:
            type: string
            format: date-time
          billDateTo:
            type: string
            format: date-time
          regionValueDateFrom:
            type: string
            format: date-time
          regionValueDateTo:
            type: string
            format: date-time
          regulationUniqueIdentifier:
            type: string
          accountRegistryCode:
            type: string
          billAmountCents:
            type: integer
            format: int64
          remittanceInformation:
            type: string
          pspCompanyName:
            type: string
          pspLastName:
            type: string
    ClassificationErrorDTO:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - CLASSIFICATION_NOT_FOUND
            - CLASSIFICATION_BAD_REQUEST
            - CLASSIFICATION_CONFLICT
            - CLASSIFICATION_GENERIC_ERROR
        message:
          type: string
    PagedClassificationView:
      type: object
      required:
        - content
        - size
        - totalElements
        - totalPages
        - number
      properties:
        content:
          type: array
          items:
            type: 'ClassificationView'
        size:
          type: integer
          format: int64
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
